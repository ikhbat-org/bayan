<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" role="img" aria-label="The Bayān naming decision tree" class="plate">
<title>The Bayān naming decision tree</title>
<style>
.sans{font-family:'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Literata', 'Georgia', serif} .mono{font-family:'JetBrains Mono', 'DejaVu Sans Mono', monospace} .ar{font-family:'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif}
</style>
<rect width="900" height="578" fill="#FFFFFF"/>
<defs><marker id="la" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6378"/></marker></defs><rect x="30" y="30" width="360" height="54" rx="27" fill="#F4F6FA" stroke="#D5DAE5" stroke-width="1.5"/><text xml:space="preserve" x="52" y="63" class="serif" font-size="15" fill="#5A6378" text-anchor="start" font-weight="600" >1.</text><text xml:space="preserve" x="78" y="63" class="sans" font-size="15" fill="#1B2236" text-anchor="start" font-weight="500" >Does it change this?</text><path d="M390,57 L480,57" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="435" y="50" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >yes</text><rect x="485" y="32" width="385" height="50" rx="10" fill="#fff" stroke="#24418F" stroke-width="1.6"/><rect x="485" y="32" width="6" height="50" rx="3" fill="#24418F"/><text xml:space="preserve" x="505" y="54" class="mono" font-size="14" fill="#24418F" text-anchor="start" font-weight="700" >void sort(ref this)</text><text xml:space="preserve" x="505" y="73" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >a plain verb on ref this</text><path d="M210,84 L210,106" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="222" y="100" class="sans" font-size="12" fill="#B3261E" text-anchor="start" font-weight="600" >no</text><rect x="30" y="108" width="360" height="54" rx="27" fill="#F4F6FA" stroke="#D5DAE5" stroke-width="1.5"/><text xml:space="preserve" x="52" y="141" class="serif" font-size="15" fill="#5A6378" text-anchor="start" font-weight="600" >2.</text><text xml:space="preserve" x="78" y="141" class="sans" font-size="15" fill="#1B2236" text-anchor="start" font-weight="500" >Does it return a changed copy or view?</text><path d="M390,135 L480,135" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="435" y="128" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >yes</text><rect x="485" y="110" width="385" height="50" rx="10" fill="#fff" stroke="#24418F" stroke-width="1.6"/><rect x="485" y="110" width="6" height="50" rx="3" fill="#24418F"/><text xml:space="preserve" x="505" y="132" class="mono" font-size="14" fill="#24418F" text-anchor="start" font-weight="700" >sorted(), trimmed()</text><text xml:space="preserve" x="505" y="151" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >the -ed form</text><path d="M210,162 L210,184" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="222" y="178" class="sans" font-size="12" fill="#B3261E" text-anchor="start" font-weight="600" >no</text><rect x="30" y="186" width="360" height="54" rx="27" fill="#F4F6FA" stroke="#D5DAE5" stroke-width="1.5"/><text xml:space="preserve" x="52" y="219" class="serif" font-size="15" fill="#5A6378" text-anchor="start" font-weight="600" >3.</text><text xml:space="preserve" x="78" y="219" class="sans" font-size="15" fill="#1B2236" text-anchor="start" font-weight="500" >Is it a bool with no arguments?</text><path d="M390,213 L480,213" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="435" y="206" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >yes</text><rect x="485" y="188" width="385" height="50" rx="10" fill="#fff" stroke="#1F7A64" stroke-width="1.6"/><rect x="485" y="188" width="6" height="50" rx="3" fill="#1F7A64"/><text xml:space="preserve" x="505" y="210" class="mono" font-size="14" fill="#1F7A64" text-anchor="start" font-weight="700" >isEmpty, hasItems, canRetry</text><text xml:space="preserve" x="505" y="229" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >is / has / can</text><path d="M210,240 L210,262" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="222" y="256" class="sans" font-size="12" fill="#B3261E" text-anchor="start" font-weight="600" >no</text><rect x="30" y="264" width="360" height="54" rx="27" fill="#F4F6FA" stroke="#D5DAE5" stroke-width="1.5"/><text xml:space="preserve" x="52" y="297" class="serif" font-size="15" fill="#5A6378" text-anchor="start" font-weight="600" >4.</text><text xml:space="preserve" x="78" y="297" class="sans" font-size="15" fill="#1B2236" text-anchor="start" font-weight="500" >Can it fail?</text><path d="M390,291 L480,291" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="435" y="284" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >yes</text><rect x="485" y="266" width="385" height="50" rx="10" fill="#fff" stroke="#B3261E" stroke-width="1.6"/><rect x="485" y="266" width="6" height="50" rx="3" fill="#B3261E"/><text xml:space="preserve" x="505" y="288" class="mono" font-size="14" fill="#B3261E" text-anchor="start" font-weight="700" >parse(text) fails ParseError</text><text xml:space="preserve" x="505" y="307" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >write the base form; tryParse is derived</text><path d="M210,318 L210,340" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="222" y="334" class="sans" font-size="12" fill="#B3261E" text-anchor="start" font-weight="600" >no</text><rect x="30" y="342" width="360" height="54" rx="27" fill="#F4F6FA" stroke="#D5DAE5" stroke-width="1.5"/><text xml:space="preserve" x="52" y="375" class="serif" font-size="15" fill="#5A6378" text-anchor="start" font-weight="600" >5.</text><text xml:space="preserve" x="78" y="375" class="sans" font-size="15" fill="#1B2236" text-anchor="start" font-weight="500" >Does it write into the caller’s buffer?</text><path d="M390,369 L480,369" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="435" y="362" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >yes</text><rect x="485" y="344" width="385" height="50" rx="10" fill="#fff" stroke="#D9892B" stroke-width="1.6"/><rect x="485" y="344" width="6" height="50" rx="3" fill="#D9892B"/><text xml:space="preserve" x="505" y="366" class="mono" font-size="14" fill="#D9892B" text-anchor="start" font-weight="700" >formatInto(ref StrBuf dst)</text><text xml:space="preserve" x="505" y="385" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >format() is derived and adds uses alloc</text><path d="M210,396 L210,418" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="222" y="412" class="sans" font-size="12" fill="#B3261E" text-anchor="start" font-weight="600" >no</text><rect x="30" y="420" width="360" height="54" rx="27" fill="#F4F6FA" stroke="#D5DAE5" stroke-width="1.5"/><text xml:space="preserve" x="52" y="453" class="serif" font-size="15" fill="#5A6378" text-anchor="start" font-weight="600" >6.</text><text xml:space="preserve" x="78" y="453" class="sans" font-size="15" fill="#1B2236" text-anchor="start" font-weight="500" >Is it a thing that does the act?</text><path d="M390,447 L480,447" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="435" y="440" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >yes</text><rect x="485" y="422" width="385" height="50" rx="10" fill="#fff" stroke="#D9892B" stroke-width="1.6"/><rect x="485" y="422" width="6" height="50" rx="3" fill="#D9892B"/><text xml:space="preserve" x="505" y="444" class="mono" font-size="14" fill="#D9892B" text-anchor="start" font-weight="700" >Parser, Hasher, Builder</text><text xml:space="preserve" x="505" y="463" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >a noun type: doer or instrument</text><path d="M210,474 L210,502" stroke="#5A6378" stroke-width="1.6" marker-end="url(#la)"/><text xml:space="preserve" x="222" y="490" class="sans" font-size="12" fill="#B3261E" text-anchor="start" font-weight="600" >no</text><rect x="30" y="506" width="360" height="50" rx="10" fill="#fff" stroke="#5A6378" stroke-width="1.6"/><text xml:space="preserve" x="52" y="528" class="mono" font-size="14" fill="#1B2236" text-anchor="start" font-weight="700" >a noun property, or a plain verb</text><text xml:space="preserve" x="52" y="546" class="sans" font-size="12" fill="#5A6378" text-anchor="start" font-weight="400" >length, span, print(x), copy(from:to:)</text>
</svg>