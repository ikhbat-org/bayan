<text xml:space="preserve" x="130" y="40" class="sans" font-size="13" fill="#5A6378" text-anchor="middle" font-weight="600" >rasm: one shape</text><path d="M82,102 C80,132 100,142 130,142 C160,142 180,132 178,102" fill="none" stroke="#1B2236" stroke-width="9" stroke-linecap="round"/><text xml:space="preserve" x="130" y="190" class="mono" font-size="13" fill="#B3261E" text-anchor="middle" font-weight="600" >b? t? th? n? y?</text><path d="M312,102 C310,132 330,142 360,142 C390,142 410,132 408,102" fill="none" stroke="#1B2236" stroke-width="9" stroke-linecap="round"/><circle cx="360" cy="160" r="6.5" fill="#B3261E"/><text xml:space="preserve" x="360" y="190" class="mono" font-size="13" fill="#1F7A64" text-anchor="middle" font-weight="600" >bāʾ · b</text><path d="M482,102 C480,132 500,142 530,142 C560,142 580,132 578,102" fill="none" stroke="#1B2236" stroke-width="9" stroke-linecap="round"/><circle cx="521" cy="74" r="6.5" fill="#B3261E"/><circle cx="539" cy="74" r="6.5" fill="#B3261E"/><text xml:space="preserve" x="530" y="190" class="mono" font-size="13" fill="#1F7A64" text-anchor="middle" font-weight="600" >tāʾ · t</text><path d="M652,102 C650,132 670,142 700,142 C730,142 750,132 748,102" fill="none" stroke="#1B2236" stroke-width="9" stroke-linecap="round"/><circle cx="690" cy="76" r="6.5" fill="#B3261E"/><circle cx="710" cy="76" r="6.5" fill="#B3261E"/><circle cx="700" cy="60" r="6.5" fill="#B3261E"/><text xml:space="preserve" x="700" y="190" class="mono" font-size="13" fill="#1F7A64" text-anchor="middle" font-weight="600" >thāʾ · th</text><path d="M210,120 L290,120" stroke="#5A6378" stroke-width="2" marker-end="url(#ij)"/><defs><marker id="ij" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5A6378"/></marker></defs><text xml:space="preserve" x="250" y="108" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="600" >iʿjām</text><text xml:space="preserve" x="530" y="40" class="sans" font-size="13" fill="#5A6378" text-anchor="middle" font-weight="600" >one shape, one reading</text><line x1="30" y1="225" x2="790" y2="225" stroke="#D5DAE5"/><text xml:space="preserve" x="130" y="262" class="mono" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="400" >x == null</text><text xml:space="preserve" x="130" y="284" class="mono" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="400" >x is not { }</text><text xml:space="preserve" x="130" y="306" class="mono" font-size="13" fill="#B3261E" text-anchor="middle" font-weight="400" >ReferenceEquals(x, null)</text><path d="M260,283 L320,283" stroke="#5A6378" stroke-width="2" marker-end="url(#ij)"/><text xml:space="preserve" x="290" y="272" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="600" >format</text><text xml:space="preserve" x="530" y="290" class="mono" font-size="22" fill="#1F7A64" text-anchor="middle" font-weight="700" >x is null</text><text xml:space="preserve" x="530" y="315" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >the one canonical spelling</text>
