<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 425" width="940" height="425" role="img" aria-label="Arabic prepositions and Bayān particles" class="plate">
<title>Arabic prepositions and Bayān particles</title>
<style>
.sans{font-family:'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Literata', 'Georgia', serif} .mono{font-family:'JetBrains Mono', 'DejaVu Sans Mono', monospace} .ar{font-family:'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif}
</style>
<rect width="940" height="425" fill="#FFFFFF"/>
<text xml:space="preserve" x="470" y="40" class="ar" font-size="30" fill="#1B2236" text-anchor="middle" font-weight="400" direction="rtl">سافرتُ  مِن دمشقَ  إلى القاهرةِ  بالقطار</text><text xml:space="preserve" x="470" y="72" class="serif" font-size="16" fill="#5A6378" text-anchor="middle" font-weight="400" font-style="italic">I travelled  from Damascus  to Cairo  by train</text><rect x="120" y="100" width="160" height="70" rx="12" fill="#E6ECF8" stroke="#24418F" stroke-width="1.5"/><text xml:space="preserve" x="200" y="140" class="ar" font-size="28" fill="#24418F" text-anchor="middle" font-weight="400" >مِن</text><text xml:space="preserve" x="200" y="162" class="sans" font-size="12" fill="#24418F" text-anchor="middle" font-weight="600" >min · from</text><rect x="390" y="100" width="160" height="70" rx="12" fill="#DDF0EA" stroke="#1F7A64" stroke-width="1.5"/><text xml:space="preserve" x="470" y="140" class="ar" font-size="28" fill="#1F7A64" text-anchor="middle" font-weight="400" >إلى</text><text xml:space="preserve" x="470" y="162" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >ilā · to</text><rect x="660" y="100" width="160" height="70" rx="12" fill="#FBEBD3" stroke="#D9892B" stroke-width="1.5"/><text xml:space="preserve" x="740" y="140" class="ar" font-size="28" fill="#D9892B" text-anchor="middle" font-weight="400" >بِ</text><text xml:space="preserve" x="740" y="162" class="sans" font-size="12" fill="#D9892B" text-anchor="middle" font-weight="600" >bi · by, with</text><path d="M200,172 C200,205 200,205 200,232" stroke="#24418F" stroke-width="2" fill="none" stroke-dasharray="5 4"/><rect x="120" y="234" width="160" height="44" rx="22" fill="#fff" stroke="#24418F" stroke-width="2"/><text xml:space="preserve" x="200" y="262" class="mono" font-size="18" fill="#24418F" text-anchor="middle" font-weight="700" >from:</text><path d="M470,172 C470,205 470,205 470,232" stroke="#1F7A64" stroke-width="2" fill="none" stroke-dasharray="5 4"/><rect x="390" y="234" width="160" height="44" rx="22" fill="#fff" stroke="#1F7A64" stroke-width="2"/><text xml:space="preserve" x="470" y="262" class="mono" font-size="18" fill="#1F7A64" text-anchor="middle" font-weight="700" >to:</text><path d="M740,172 C740,205 740,205 740,232" stroke="#D9892B" stroke-width="2" fill="none" stroke-dasharray="5 4"/><rect x="660" y="234" width="160" height="44" rx="22" fill="#fff" stroke="#D9892B" stroke-width="2"/><text xml:space="preserve" x="740" y="262" class="mono" font-size="18" fill="#D9892B" text-anchor="middle" font-weight="700" >by:</text><rect x="30" y="310" width="880" height="64" rx="10" fill="#F4F6FA" stroke="#D5DAE5"/><text xml:space="preserve" x="470" y="350" class="mono" font-size="19" fill="#1B2236" text-anchor="middle" font-weight="400" ><tspan fill="#1B2236">ledger.transfer(amount, </tspan><tspan fill="#24418F" font-weight="700">from:</tspan><tspan fill="#1B2236"> alice, </tspan><tspan fill="#1F7A64" font-weight="700">to:</tspan><tspan fill="#1B2236"> bob)</tspan></text><text xml:space="preserve" x="470" y="404" class="sans" font-size="13" fill="#5A6378" text-anchor="middle" font-weight="400" >eight particles in all: from, to, until, through, at, by, for, as; the object takes none</text>
</svg>