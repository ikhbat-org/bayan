<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" width="900" height="295" role="img" aria-label="The ḥāl pattern: head verb then participle" class="plate">
<title>The ḥāl pattern: head verb then participle</title>
<style>
.sans{font-family:'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Literata', 'Georgia', serif} .mono{font-family:'JetBrains Mono', 'DejaVu Sans Mono', monospace} .ar{font-family:'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif}
</style>
<rect width="900" height="295" fill="#FFFFFF"/>
<text xml:space="preserve" x="220" y="40" class="sans" font-size="14" fill="#1B2236" text-anchor="middle" font-weight="600" >Arabic: “Zayd came, riding”</text><text xml:space="preserve" x="700" y="40" class="sans" font-size="14" fill="#1B2236" text-anchor="middle" font-weight="600" >Bayān: cleanup on failure</text><rect x="35" y="70" width="170" height="74" rx="12" fill="#24418F"/><text xml:space="preserve" x="120" y="108" class="ar" font-size="24" fill="#fff" text-anchor="middle" font-weight="400" >جاءَ</text><text xml:space="preserve" x="120" y="131" class="sans" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >jāʾa · came</text><rect x="235" y="70" width="170" height="74" rx="12" fill="#E6ECF8" stroke="#24418F" stroke-width="1.5"/><text xml:space="preserve" x="320" y="108" class="ar" font-size="24" fill="#24418F" text-anchor="middle" font-weight="400" >راكبًا</text><text xml:space="preserve" x="320" y="131" class="sans" font-size="11.5" fill="#24418F" text-anchor="middle" font-weight="400" >rākiban · riding</text><path d="M205,107 L235,107" stroke="#24418F" stroke-width="2"/><text xml:space="preserve" x="120" y="170" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >head: the act</text><text xml:space="preserve" x="320" y="170" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >ḥāl: when it applies</text><rect x="515" y="70" width="170" height="74" rx="12" fill="#D9892B"/><text xml:space="preserve" x="600" y="108" class="mono" font-size="19" fill="#fff" text-anchor="middle" font-weight="700" >defer</text><text xml:space="preserve" x="600" y="131" class="sans" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="400" >run at scope exit</text><rect x="715" y="70" width="170" height="74" rx="12" fill="#FBEBD3" stroke="#D9892B" stroke-width="1.5"/><text xml:space="preserve" x="800" y="108" class="mono" font-size="19" fill="#D9892B" text-anchor="middle" font-weight="700" >failing</text><text xml:space="preserve" x="800" y="131" class="sans" font-size="11.5" fill="#D9892B" text-anchor="middle" font-weight="400" >only when failing</text><path d="M685,107 L715,107" stroke="#D9892B" stroke-width="2"/><text xml:space="preserve" x="600" y="170" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >head: the act</text><text xml:space="preserve" x="800" y="170" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >ḥāl: when it applies</text><text xml:space="preserve" x="520" y="215" class="mono" font-size="14" fill="#1B2236" text-anchor="start" font-weight="700" >defer</text><text xml:space="preserve" x="710" y="215" class="sans" font-size="13" fill="#5A6378" text-anchor="start" font-weight="400" >every exit</text><text xml:space="preserve" x="520" y="245" class="mono" font-size="14" fill="#1B2236" text-anchor="start" font-weight="700" >defer failing</text><text xml:space="preserve" x="710" y="245" class="sans" font-size="13" fill="#5A6378" text-anchor="start" font-weight="400" >exit by failure</text><text xml:space="preserve" x="520" y="275" class="mono" font-size="14" fill="#1B2236" text-anchor="start" font-weight="700" >defer panicking</text><text xml:space="preserve" x="710" y="275" class="sans" font-size="13" fill="#5A6378" text-anchor="start" font-weight="400" >panic in progress</text><text xml:space="preserve" x="35" y="215" class="serif" font-size="16" fill="#1B2236" text-anchor="start" font-weight="400" >Head first, circumstance after.</text><text xml:space="preserve" x="35" y="240" class="serif" font-size="14" fill="#5A6378" text-anchor="start" font-weight="400" >One shape for every statement modifier,</text><text xml:space="preserve" x="35" y="262" class="serif" font-size="14" fill="#5A6378" text-anchor="start" font-weight="400" >so the family can grow without new keywords.</text>
</svg>