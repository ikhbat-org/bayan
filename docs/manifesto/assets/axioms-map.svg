<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 444" width="990" height="444" role="img" aria-label="The ten axioms grouped by what they govern" class="plate">
<title>The ten axioms grouped by what they govern</title>
<style>
.sans{font-family:'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Literata', 'Georgia', serif} .mono{font-family:'JetBrains Mono', 'DejaVu Sans Mono', monospace} .ar{font-family:'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif}
</style>
<rect width="990" height="444" fill="#FFFFFF"/>
<rect x="30" y="20" width="300" height="404" rx="16" fill="#E6ECF8" stroke="none"/><text xml:space="preserve" x="50" y="54" class="sans" font-size="15" fill="#24418F" text-anchor="start" font-weight="700" >How names are built</text><rect x="46" y="76" width="268" height="72" rx="12" fill="#fff" stroke="#24418F" stroke-opacity=".5"/><circle cx="78" cy="112" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="78" y="118" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >I</text><text xml:space="preserve" x="112" y="107" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Ṣarf</text><text xml:space="preserve" x="112" y="128" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >roots and patterns</text><rect x="46" y="162" width="268" height="72" rx="12" fill="#fff" stroke="#24418F" stroke-opacity=".5"/><circle cx="78" cy="198" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="78" y="204" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >V</text><text xml:space="preserve" x="112" y="193" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Particles</text><text xml:space="preserve" x="112" y="214" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >roles, not positions</text><rect x="46" y="248" width="268" height="72" rx="12" fill="#fff" stroke="#24418F" stroke-opacity=".5"/><circle cx="78" cy="284" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="78" y="290" class="serif" font-size="12.5" fill="#B3261E" text-anchor="middle" font-weight="600" >VII</text><text xml:space="preserve" x="112" y="279" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Iʿjām</text><text xml:space="preserve" x="112" y="300" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >one spelling per construct</text><rect x="350" y="20" width="300" height="404" rx="16" fill="#DDF0EA" stroke="none"/><text xml:space="preserve" x="370" y="54" class="sans" font-size="15" fill="#1F7A64" text-anchor="start" font-weight="700" >How code is read</text><rect x="366" y="76" width="268" height="72" rx="12" fill="#fff" stroke="#1F7A64" stroke-opacity=".5"/><circle cx="398" cy="112" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="398" y="118" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >IV</text><text xml:space="preserve" x="432" y="107" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Waqf</text><text xml:space="preserve" x="432" y="128" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >newlines are grammar</text><rect x="366" y="162" width="268" height="72" rx="12" fill="#fff" stroke="#1F7A64" stroke-opacity=".5"/><circle cx="398" cy="198" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="398" y="204" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >VI</text><text xml:space="preserve" x="432" y="193" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Head first</text><text xml:space="preserve" x="432" y="214" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >defer failing</text><rect x="366" y="248" width="268" height="72" rx="12" fill="#fff" stroke="#1F7A64" stroke-opacity=".5"/><circle cx="398" cy="284" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="398" y="290" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >X</text><text xml:space="preserve" x="432" y="279" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >The hoopoe</text><text xml:space="preserve" x="432" y="300" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >clear diagnostics</text><rect x="670" y="20" width="300" height="404" rx="16" fill="#FBEBD3" stroke="none"/><text xml:space="preserve" x="690" y="54" class="sans" font-size="15" fill="#D9892B" text-anchor="start" font-weight="700" >What the compiler guarantees</text><rect x="686" y="76" width="268" height="72" rx="12" fill="#fff" stroke="#D9892B" stroke-opacity=".5"/><circle cx="718" cy="112" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="718" y="118" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >II</text><text xml:space="preserve" x="752" y="107" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Kāna, ṣāra</text><text xml:space="preserve" x="752" y="128" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >state in the type</text><rect x="686" y="162" width="268" height="72" rx="12" fill="#fff" stroke="#D9892B" stroke-opacity=".5"/><circle cx="718" cy="198" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="718" y="204" class="serif" font-size="12.5" fill="#B3261E" text-anchor="middle" font-weight="600" >III</text><text xml:space="preserve" x="752" y="193" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Except, because</text><text xml:space="preserve" x="752" y="214" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >named exclusions, stated reasons</text><rect x="686" y="248" width="268" height="72" rx="12" fill="#fff" stroke="#D9892B" stroke-opacity=".5"/><circle cx="718" cy="284" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="718" y="290" class="serif" font-size="12.5" fill="#B3261E" text-anchor="middle" font-weight="600" >VIII</text><text xml:space="preserve" x="752" y="279" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Nothing hidden</text><text xml:space="preserve" x="752" y="300" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >effects and errors in the signature</text><rect x="686" y="334" width="268" height="72" rx="12" fill="#fff" stroke="#D9892B" stroke-opacity=".5"/><circle cx="718" cy="370" r="22" fill="none" stroke="#B3261E" stroke-width="1.6"/><text xml:space="preserve" x="718" y="376" class="serif" font-size="15" fill="#B3261E" text-anchor="middle" font-weight="600" >IX</text><text xml:space="preserve" x="752" y="365" class="serif" font-size="17" fill="#1B2236" text-anchor="start" font-weight="600" >Valid by construction</text><text xml:space="preserve" x="752" y="386" class="sans" font-size="12.5" fill="#5A6378" text-anchor="start" font-weight="400" >rules checked at construction</text>
</svg>