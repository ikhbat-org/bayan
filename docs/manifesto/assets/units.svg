<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-label="Unit conversion: finer is implicit, coarser names its rounding" class="plate">
<title>Unit conversion: finer is implicit, coarser names its rounding</title>
<style>
.sans{font-family:'IBM Plex Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif} .serif{font-family:'Literata', 'Georgia', serif} .mono{font-family:'JetBrains Mono', 'DejaVu Sans Mono', monospace} .ar{font-family:'Amiri', 'Noto Naskh Arabic', 'Scheherazade New', serif}
</style>
<rect width="820" height="310" fill="#FFFFFF"/>
<rect x="40" y="60" width="180" height="70" rx="12" fill="#E6ECF8" stroke="#24418F" stroke-width="1.5"/><text xml:space="preserve" x="130" y="92" class="mono" font-size="18" fill="#24418F" text-anchor="middle" font-weight="700" >Minutes</text><text xml:space="preserve" x="130" y="116" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >literal: 5min</text><rect x="340" y="60" width="180" height="70" rx="12" fill="#E6ECF8" stroke="#24418F" stroke-width="1.5"/><text xml:space="preserve" x="430" y="92" class="mono" font-size="18" fill="#24418F" text-anchor="middle" font-weight="700" >Seconds</text><text xml:space="preserve" x="430" y="116" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >literal: 5s</text><rect x="640" y="60" width="180" height="70" rx="12" fill="#E6ECF8" stroke="#24418F" stroke-width="1.5"/><text xml:space="preserve" x="730" y="92" class="mono" font-size="18" fill="#24418F" text-anchor="middle" font-weight="700" >Millis</text><text xml:space="preserve" x="730" y="116" class="sans" font-size="12" fill="#5A6378" text-anchor="middle" font-weight="400" >literal: 5ms</text><defs><marker id="u1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F7A64"/></marker><marker id="u2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/></marker></defs><path d="M220,78 L338,78" stroke="#1F7A64" stroke-width="2.2" marker-end="url(#u1)"/><text xml:space="preserve" x="280" y="68" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >implicit</text><path d="M338,116 L222,116" stroke="#B3261E" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#u2)"/><text xml:space="preserve" x="280" y="140" class="sans" font-size="12" fill="#B3261E" text-anchor="middle" font-weight="600" >name the rounding</text><path d="M520,78 L638,78" stroke="#1F7A64" stroke-width="2.2" marker-end="url(#u1)"/><text xml:space="preserve" x="580" y="68" class="sans" font-size="12" fill="#1F7A64" text-anchor="middle" font-weight="600" >implicit</text><path d="M638,116 L522,116" stroke="#B3261E" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#u2)"/><text xml:space="preserve" x="580" y="140" class="sans" font-size="12" fill="#B3261E" text-anchor="middle" font-weight="600" >name the rounding</text><text xml:space="preserve" x="40" y="190" class="mono" font-size="16" fill="#1B2236" text-anchor="start" font-weight="400" >2s + 500ms</text><text xml:space="preserve" x="260" y="190" class="sans" font-size="14" fill="#1F7A64" text-anchor="start" font-weight="600" >→ Millis 2500  (finer: free)</text><text xml:space="preserve" x="40" y="222" class="mono" font-size="16" fill="#1B2236" text-anchor="start" font-weight="400" >t.floor&lt;Seconds&gt;()</text><text xml:space="preserve" x="260" y="222" class="sans" font-size="14" fill="#1B2236" text-anchor="start" font-weight="400" >→ coarser, rounding down</text><text xml:space="preserve" x="40" y="254" class="mono" font-size="16" fill="#1B2236" text-anchor="start" font-weight="400" >t.ceiling&lt;Seconds&gt;()</text><text xml:space="preserve" x="260" y="254" class="sans" font-size="14" fill="#1B2236" text-anchor="start" font-weight="400" >→ coarser, rounding up (a Retry-After header)</text><text xml:space="preserve" x="40" y="286" class="mono" font-size="16" fill="#B3261E" text-anchor="start" font-weight="400" >let w: Grams = 0</text><text xml:space="preserve" x="260" y="286" class="sans" font-size="14" fill="#B3261E" text-anchor="start" font-weight="600" >✗ a bare number has no unit: write 0g</text>
</svg>