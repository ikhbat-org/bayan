name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  # By hand on any branch (gh workflow run ci.yml --ref <branch>), e.g. to check a branch before it is pushed to dev.
  workflow_dispatch:

# A newer push or dispatch on the same ref cancels the run in progress: only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            exe: bayan
          - os: macos-latest
            rid: osx-arm64
            exe: bayan
          - os: windows-latest
            rid: win-x64
            exe: bayan.exe
    runs-on: ${{ matrix.os }}
    # Ported tools and SourcesAreFormatted run on the pinned bayan; a CI checkout has no local `dev`, so pin the commit under test.
    env:
      PINNED_BAYAN_REF: HEAD
    steps:
      # Replaces actions/checkout (spec 015 handoff, T4): the exact commit at depth 1. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # Replaces actions/setup-dotnet: the SDK pinned in install-dotnet.sh, sha512-checked.
      - name: Install .NET SDK
        shell: bash
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      # The tests cross-compile (OutputTests) and `bayan doctor` expects zig; no runner image has it.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Script tests
        if: runner.os != 'Windows'
        run: |
          bash scripts/ci/install-zig.test.sh
          bash scripts/ci/install-dotnet.test.sh
          bash scripts/ci/sdk-patch-check.test.sh
          bash scripts/ci/known-failures.test.sh
          bash scripts/release/package.test.sh
          bash scripts/release/memory-gate.test.sh
          bash scripts/release/editor-gate.test.sh
          bash scripts/release/refuse-draft.test.sh
          bash scripts/release/release-workflow.test.sh
          bash scripts/bayan-tool.test.sh
          bash scripts/parity/run.test.sh
      - name: Docs and release script tests
        if: runner.os == 'Linux'
        run: |
          bash scripts/release/set-version.test.sh
          bash scripts/release/cut.test.sh
          for f in scripts/docs/*.test.sh; do bash "$f"; done
          bash scripts/docs/check.sh
      - name: Test
        if: runner.os != 'Windows'
        env:
          BAYAN_TEST_TIME_SCALE: 3
          # macos-latest hit the same 600 s zig cc timeout on selfhost/semantics as Windows below (ci run 43583631792,
          # 2026-11-14: 118 SelfhostSemanticsT17 tests failed on the one timed-out build).
          BAYAN_CC_TIMEOUT_S: 1800
        run: dotnet test Bayan.slnx -c Release
      # Windows has known failures until spec 014 (Q743); the next step decides the job.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        env:
          BAYAN_TEST_TIME_SCALE: 3
          # zig cc of selfhost/semantics took over the 600 s default on windows-latest (ci run 42602448089, 2026-11-09:
          # 118 SelfhostSemanticsT17 tests failed on the one timed-out build).
          BAYAN_CC_TIMEOUT_S: 1800
        run: dotnet test Bayan.slnx -c Release --logger "trx;LogFileName=windows.trx" --results-directory TestResults
      - name: Check known failures (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # The hosted Windows image names its Python `python`; `python3` is not guaranteed there.
        run: python -I scripts/ci/known-failures.py tests/windows-known-failures.txt TestResults/windows.trx
      - name: Publish (NativeAOT)
        run: dotnet publish src/Bayan.Cli -c Release -r ${{ matrix.rid }} -o out
      - name: Smoke test AOT binary
        shell: bash
        run: ./out/${{ matrix.exe }} --version
