# Nightly and on-demand batch mutation run (spec 013 T28): scripts/selfhost/mutate-batch.sh over the selfhost .byn files,
# split into SHARDS parallel jobs (--shard k/4). It only measures: it never commits or pushes. Each shard uploads its reports
# (tmp/mutate-batch/, paths relative to the repo root); the `merge` job runs one quality-baseline.py update over all of them and
# uploads tests/quality-baseline.json and the accepted reports. Apply the run by `python3 -I scripts/selfhost/quality-baseline.py update tests/quality-baseline.json . <reports...>`
# on a chore/ branch off current dev, never by copying the baseline file.
name: mutation

on:
  # Nightly schedule off (2026-11-04): each group re-records the shared law tests (~2h a group, 83 groups), so shards hit the
  # 6h limit. Back on once groups share one recording per shard (handoff Q910).
  # schedule:
  #   - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]  # n = 4: --shard k/4
    steps:
      # Replaces actions/checkout (spec 015 handoff, T4): the exact commit at depth 1. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # Replaces actions/setup-dotnet: the SDK pinned in install-dotnet.sh, sha512-checked.
      - name: Install .NET SDK
        shell: bash
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      # The tests cross-compile (OutputTests) and `bayan doctor` expects zig; no runner image has it.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build
        run: dotnet build Bayan.slnx
      - name: Mutate
        env:
          PINNED_BAYAN_REF: HEAD  # the dev commit this run checked out (no dev branch in a depth-1 checkout)
        run: bash scripts/selfhost/mutate-batch.sh --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-reports-${{ matrix.shard }}
          path: tmp/mutate-batch/
  merge:
    needs: mutate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Replaces actions/checkout (spec 015 handoff, T4): the exact commit at depth 1. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - uses: actions/download-artifact@v8
        with:
          pattern: mutation-reports-*
          path: reports
      - name: Merge
        run: |
          mapfile -t reports < <(find reports -name 'quality-[0-9]*.json' | sort)
          python3 -I scripts/selfhost/quality-baseline.py check tests/quality-baseline.json . "${reports[@]}"
          python3 -I scripts/selfhost/quality-baseline.py update tests/quality-baseline.json . "${reports[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: quality-baseline
          path: tests/quality-baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: accepted-reports
          path: reports/**/quality-[0-9]*.json
