name: release

# A v* tag builds the self-hosted compiler (from bootstrap/bayan.c, no .NET) on each target's own runner and opens a draft GitHub Release with the
# archives and SHA256SUMS; publishing the draft is a manual step. Decision 2026-11-02 (handoff progress log).
on:
  push:
    tags: ['v*']
  # A dry run on a branch: it checks `version` the way the tag is checked and runs every job but the draft. A dispatch
  # never drafts a release: with dry_run false the release job starts and refuses (refuse-draft.sh).
  workflow_dispatch:
    inputs:
      version: { description: 'Dry-run version (e.g. 0.3.0-rc.1)', required: true }
      dry_run: { description: 'Dry run (no release job)', type: boolean, default: true }

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, exe: bayan, lsp: bayan-lsp }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: bayan, lsp: bayan-lsp }
          - { os: macos-15, rid: osx-arm64, exe: bayan, lsp: bayan-lsp }
          - { os: macos-15-intel, rid: osx-x64, exe: bayan, lsp: bayan-lsp }
          - { os: windows-2025, rid: win-x64, exe: bayan.exe, lsp: bayan-lsp.exe }
          - { os: windows-11-arm, rid: win-arm64, exe: bayan.exe, lsp: bayan-lsp.exe }
    runs-on: ${{ matrix.os }}
    # The tag being released: the pushed tag, or v + the dry run's input. Steps read it from here, never from the input.
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # Same shell checkout as ci.yml: the exact commit at depth 1. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Check tag against VERSION
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: bash scripts/release/package.sh check-tag "$RELEASE_TAG"
      # A dry run takes vX.Y.Z-rc.N, X.Y.Z being VERSION without -dev.
      - name: Check dry-run version against VERSION
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: bash scripts/release/package.sh check-dry-run-tag "$RELEASE_TAG"
      # The mirrors and generated docs are checked on the Linux runners only, as in ci.yml (check.sh is untested on Windows Git Bash).
      - name: Check VERSION mirrors and generated docs
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/docs/check.sh
      # No .NET (spec 019 R24): zig is the C compiler where a runner has no cc (Windows) and the cross-build driver.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      # The shipped `bayan` is the self-hosted compiler (spec 017, 019 R25). Stage 0 is bootstrap/bayan.c built by a C
      # compiler, stage 1 is src/driver built by stage 0 (scripts/bootstrap-build.sh), stage 2 is src/driver built by
      # stage 1, native for this runner (no --target).
      - name: Build stage 1 from the bootstrap
        shell: bash
        run: |
          s1="$(bash scripts/bootstrap-build.sh)" || { tail -n 40 tmp/bootstrap-build/stage*.log; exit 1; }
          echo "STAGE1=$s1" >> "$GITHUB_ENV"
      - name: Build stage 2 (the shipped bayan)
        shell: bash
        run: |
          mkdir -p publish
          "$STAGE1" build --mode safe --package src -o publish/${{ matrix.exe }} src/driver
      - name: Smoke test
        shell: bash
        run: ./publish/${{ matrix.exe }} --version | grep -F "bayan $(cat VERSION) (selfhost)"
      # bayan-lsp ships beside bayan, built by this release's own bayan (spec 019 R37); package.sh refuses an archive without it.
      - name: Build bayan-lsp
        shell: bash
        run: ./publish/${{ matrix.exe }} build --package editors/language-server/src -o publish/${{ matrix.lsp }} editors/language-server/src/app
      - name: Package
        shell: bash
        run: bash scripts/release/package.sh pack ${{ matrix.rid }} publish dist
      - uses: actions/upload-artifact@v7
        with:
          name: bayan-${{ matrix.rid }}
          path: dist/bayan-*

  # The memory and disk release gate (docs/memory-leaks.md): a release waits for it on both hosts.
  # The timeout sums the gate's own bounds (scripts/release/memory-gate.sh), so a hang ends with the gate's named bound, not
  # the runner's: test blocks at the driver's 60 s each, 23 bayan-lsp + 13 `bound: ` + 2 T12 cases = 38 min; the golden
  # runner bound's 30 min; four C compiles (src/driver, the two test binaries, the golden bound's) at BAYAN_CC_TIMEOUT_S's
  # 10 min = 40 min; 108 min, plus stage 0 (an unbounded cc of bootstrap/bayan.c), checkout and zig, with a margin: 150.
  memory-gate:
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # No .NET (spec 019 R24): the bayan-lsp bounds run on the Bayān server since T38b; the pinned bayan comes from the bootstrap.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Memory gate
        shell: bash
        run: bash scripts/release/memory-gate.sh

  # The memory gate of the VS Code extension and bayan-lsp (editor-gate.yml, also run on every push to dev).
  editor-gate:
    uses: ./.github/workflows/editor-gate.yml

  # The full tier of every enacted law (laws-nightly.yml, also its nightly schedule): 37 min on wp1, 180 min allowed.
  laws:
    uses: ./.github/workflows/laws-nightly.yml

  # Diverse double-compiling from the frozen C# compiler (ddc.yml, also its weekly schedule; spec 019 R27).
  ddc:
    uses: ./.github/workflows/ddc.yml

  release:
    needs: [build, memory-gate, editor-gate, laws, ddc]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:

      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # In a step, not only the job's `if:`: a release candidate tag and a dispatch run both stop here.
      - name: Refuse a release candidate or a dispatch run
        shell: bash
        run: bash scripts/release/refuse-draft.sh "$RELEASE_TAG" "$GITHUB_EVENT_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="$(bash scripts/release/package.sh check-tag "$GITHUB_REF_NAME")"
          bash scripts/release/package.sh docs dist
          bash scripts/release/package.sh sums dist
          # dist/bayan-* is the six compiler archives (bayan and bayan-lsp each) and bayan-$v-docs.tar.gz.
          mkdir -p tmp && bash scripts/release/package.sh notes "$v" > tmp/notes.md
          # 0.x releases are GitHub prereleases (user, 2026-11-14).
          gh release create "$GITHUB_REF_NAME" dist/bayan-* dist/SHA256SUMS --draft --verify-tag \
            $(bash scripts/release/package.sh release-flags "$v") --title "Bayān $v" --notes-file tmp/notes.md
