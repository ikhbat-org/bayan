name: release

# A v* tag builds the NativeAOT compiler on each target's own runner and opens a draft GitHub Release with the
# archives and SHA256SUMS; publishing the draft is a manual step. Decision 2026-11-02 (handoff progress log).
on:
  push:
    tags: ['v*']
  # A dry run on a branch: it checks `version` the way the tag is checked and runs every job but the draft. A dispatch
  # never drafts a release: with dry_run false the release job starts and refuses (refuse-draft.sh).
  workflow_dispatch:
    inputs:
      version: { description: 'Dry-run version (e.g. 0.3.0-rc.1)', required: true }
      dry_run: { description: 'Dry run (no release job)', type: boolean, default: true }

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, rid: linux-x64, exe: bayan }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, exe: bayan }
          - { os: macos-15, rid: osx-arm64, exe: bayan }
          - { os: macos-15-intel, rid: osx-x64, exe: bayan }
          - { os: windows-2025, rid: win-x64, exe: bayan.exe }
          - { os: windows-11-arm, rid: win-arm64, exe: bayan.exe }
    runs-on: ${{ matrix.os }}
    # The tag being released: the pushed tag, or v + the dry run's input. Steps read it from here, never from the input.
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      # Same shell checkout as ci.yml: the exact commit at depth 1. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Check tag against VERSION
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: bash scripts/release/package.sh check-tag "$RELEASE_TAG"
      # A dry run takes vX.Y.Z-rc.N, X.Y.Z being VERSION without -dev.
      - name: Check dry-run version against VERSION
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: bash scripts/release/package.sh check-dry-run-tag "$RELEASE_TAG"
      # The mirrors and generated docs are checked on the Linux runners only, as in ci.yml (check.sh is untested on Windows Git Bash).
      - name: Check VERSION mirrors and generated docs
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/docs/check.sh
      - name: Install .NET SDK
        shell: bash
        env:
          DOTNET_RID: ${{ matrix.rid }}
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      - name: Publish (NativeAOT)
        run: dotnet publish src/Bayan.Cli -c Release -r ${{ matrix.rid }} -o publish
      # The shipped `bayan` is the self-hosted compiler (spec 017): the C# build above only bootstraps it. Stage 1 is
      # the driver built by the C# compiler, stage 2 the driver built by stage 1, native for this runner (no --target).
      # The C# `build` needs a C compiler; zig is the one the memory-gate job installs.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build stage 1
        shell: bash
        run: ./publish/${{ matrix.exe }} build --mode safe --package selfhost -o "$RUNNER_TEMP/stage1-${{ matrix.exe }}" selfhost/driver
      - name: Build stage 2 (the shipped bayan)
        shell: bash
        run: |
          "$RUNNER_TEMP/stage1-${{ matrix.exe }}" build --mode safe --package selfhost -o publish/${{ matrix.exe }} selfhost/driver
      - name: Smoke test
        shell: bash
        run: ./publish/${{ matrix.exe }} --version | grep -F "bayan $(cat VERSION) (selfhost)"
      - name: Package
        shell: bash
        run: bash scripts/release/package.sh pack ${{ matrix.rid }} publish dist
      - uses: actions/upload-artifact@v7
        with:
          name: bayan-${{ matrix.rid }}
          path: dist/bayan-*

  # The memory and disk release gate (docs/memory-leaks.md): a release waits for it on both hosts.
  memory-gate:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install .NET SDK
        shell: bash
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Memory gate
        shell: bash
        run: bash scripts/release/memory-gate.sh

  # The memory gate of the VS Code extension and bayan-lsp (editor-gate.yml, also run on every push to dev).
  editor-gate:
    uses: ./.github/workflows/editor-gate.yml

  # The full tier of every enacted law (laws-nightly.yml, also its nightly schedule): 37 min on wp1, 180 min allowed.
  laws:
    uses: ./.github/workflows/laws-nightly.yml

  release:
    needs: [build, memory-gate, editor-gate, laws]
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:

      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # In a step, not only the job's `if:`: a release candidate tag and a dispatch run both stop here.
      - name: Refuse a release candidate or a dispatch run
        shell: bash
        run: bash scripts/release/refuse-draft.sh "$RELEASE_TAG" "$GITHUB_EVENT_NAME"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="$(bash scripts/release/package.sh check-tag "$GITHUB_REF_NAME")"
          bash scripts/release/package.sh docs dist
          bash scripts/release/package.sh sums dist
          # dist/bayan-* is the six compiler archives and bayan-$v-docs.tar.gz.
          mkdir -p tmp && bash scripts/release/package.sh notes "$v" > tmp/notes.md
          gh release create "$GITHUB_REF_NAME" dist/bayan-* dist/SHA256SUMS --draft --verify-tag \
            --title "Bayān $v" --notes-file tmp/notes.md
