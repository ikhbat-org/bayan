# Diverse double-compiling (spec 019 R27, T46): scripts/ci/ddc.sh builds the frozen C# compiler from its tag, builds the
# self-hosted compiler from the frozen tree with it, and fails unless the C it emits for src/driver equals that tree's
# bootstrap/bayan.c; then it runs the laws listed in scripts/ci/ddc-laws.txt on the frozen compiler, and
# scripts/selfhost/reexport-check.sh re-exports a sample of the frozen files (L043; every class on a dispatch with `full`).
# Weekly, and a required job of every release (release.yml). This is the only workflow that installs .NET (019 plan). A red run on release day
# most often means the surroundings changed (SDK download, runner image): fix those and re-run (019 OQ6).
name: ddc

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ref: { description: 'Frozen ref', required: false, default: 'v0.3.2' }
      full: { description: 'Re-export every class (L043), not the weekly sample', type: boolean, required: false, default: false }
  # release.yml calls it: the job is required by a release.
  workflow_call:

permissions:
  contents: read

# One run at a time per branch for a scheduled or dispatched run. A run called by release.yml gets a group of its own
# (github.workflow is then the caller's name), as laws-nightly.yml does: in one shared group a second waiting run cancels
# the first (laws-nightly.yml records two such cancelled runs, 44689818294 and 44695267947).
concurrency:
  group: ddc-${{ github.workflow == 'ddc' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  ddc:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 300 || 60 }}
    env:
      # v0.3.2 (the C# oracle freeze) until the owner tags csharp-final (T65); T65 switches both defaults.
      DDC_REF: ${{ inputs.ref || 'v0.3.2' }}
    steps:
      # Same shell checkout as ci.yml: the exact commit at depth 1, plus the frozen tag ddc.sh archives. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$DDC_REF:refs/tags/$DDC_REF"
      - name: Install .NET SDK
        shell: bash
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      # The C# compiler's `build` of src/driver needs a C compiler; zig is the one release.yml installs.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Diverse double-compiling
        shell: bash
        env:
          BAYAN_TEST_TIME_SCALE: 3
        run: bash scripts/ci/ddc.sh "$DDC_REF"
  # L043 (spec 019 T59): the C# compiler at the export head tests/cases/FREEZE.tsv names re-exports one class per kind
  # (seeded by the ISO week), or every class on a dispatch with `full`; each compared frozen file must match the tree.
  # macOS, the host the frozen files were exported on (owner, 2026-11-21): they name the host (`macos-arm64`), its temp
  # directory, and number cases in directory-listing order; the full run on Linux (wp1 WSL, 3e19e8532) differed in 987 of 54,337 files.
  reexport:
    runs-on: macos-15
    timeout-minutes: ${{ inputs.full && 300 || 60 }}
    steps:
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      - name: Install .NET SDK
        shell: bash
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Frozen files re-export
        shell: bash
        env:
          BAYAN_TEST_TIME_SCALE: 3
          REEXPORT_FULL: ${{ inputs.full && '--full' || '' }}
          PINNED_BAYAN_REF: HEAD  # the golden runner's compiler; a depth-1 checkout has no dev branch
        run: |
          sha="$(awk -F'\t' '$1 == "export" { print $3 }' tests/cases/FREEZE.tsv)"
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$sha"
          bash scripts/selfhost/reexport-check.sh $REEXPORT_FULL
