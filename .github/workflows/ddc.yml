# Diverse double-compiling (spec 019 R27, T46): scripts/ci/ddc.sh builds the frozen C# compiler from its tag, builds the
# self-hosted compiler from the frozen tree with it, and fails unless the C it emits for src/driver equals that tree's
# bootstrap/bayan.c; then it runs the laws listed in scripts/ci/ddc-laws.txt on the frozen compiler. Weekly, and a required
# job of every release (release.yml). This is the only workflow that installs .NET (019 plan). A red run on release day
# most often means the surroundings changed (SDK download, runner image): fix those and re-run (019 OQ6).
name: ddc

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      ref: { description: 'Frozen ref', required: false, default: 'v0.3.2' }
  # release.yml calls it: the job is required by a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ddc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ddc:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # v0.3.2 (the C# oracle freeze) until the owner tags csharp-final (T65); T65 switches both defaults.
      DDC_REF: ${{ inputs.ref || 'v0.3.2' }}
    steps:
      # Same shell checkout as ci.yml: the exact commit at depth 1, plus the frozen tag ddc.sh archives. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          git fetch -q --depth=1 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "refs/tags/$DDC_REF:refs/tags/$DDC_REF"
      - name: Install .NET SDK
        shell: bash
        run: |
          dotnet_root="$(bash scripts/ci/install-dotnet.sh "$RUNNER_TEMP/dotnet")"
          echo "DOTNET_ROOT=$dotnet_root" >> "$GITHUB_ENV"
          echo "$dotnet_root" >> "$GITHUB_PATH"
      # The C# compiler's `build` of src/driver needs a C compiler; zig is the one release.yml installs.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Diverse double-compiling
        shell: bash
        env:
          BAYAN_TEST_TIME_SCALE: 3
        run: bash scripts/ci/ddc.sh "$DDC_REF"
