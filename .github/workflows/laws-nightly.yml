# Nightly and on-demand full tier of every enacted law (spec 011 D11): scripts/selfhost/pre-push-laws.sh runs each enacted
# law's proof with BAYAN_LAW_TIER=full, the whole corpus where the merge gate runs a fixed seeded subset. It only measures: it never
# commits or pushes. The job allows 180 min (the full tier measured 37 min on wp1); the merge gate's seeded subset keeps `timeout: 1200`.
name: laws-nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  # release.yml calls it: the full tier is a required job of a release.
  workflow_call:

permissions:
  contents: read

# One run at a time per branch for a scheduled or dispatched run. A run called by release.yml gets a group of its own
# (github.workflow is then the caller's name): in one shared group a second waiting run cancels the first, which on
# 2026-11-20 cancelled a dispatched run (44689818294) and the laws job of a release dry run (44695267947) before either started.
concurrency:
  group: laws-nightly-${{ github.workflow == 'laws-nightly' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  laws:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Replaces actions/checkout (spec 015 handoff, T4): the exact commit and its parent (depth 2, as ci.yml): the `check:` of
      # several laws runs scripts/ci/bootstrap-check.sh, which builds from HEAD^1. The repo is public, so no token.
      - name: Checkout
        shell: bash
        run: |
          git init -q .
          git fetch -q --depth=2 --no-tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
      # The law checks build from the bootstrap and cross-compile with zig (`bayan doctor` expects it); no runner image has it.
      - name: Install zig
        shell: bash
        run: bash scripts/ci/install-zig.sh "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      # As ci.yml: stage 0 from bootstrap/bayan.c, stage 1 from src/ (spec 019 R24); the later steps run stage 1 as $BAYAN_EXE.
      # No .NET (spec 019 T44a): every enacted law's `check:` runs scripts/ci/bootstrap-check.sh or a script, not `dotnet`.
      - name: Build from the bootstrap
        shell: bash
        run: |
          s1="$(bash scripts/bootstrap-build.sh)" || { tail -n 40 tmp/bootstrap-build/stage*.log; exit 1; }
          echo "BAYAN_EXE=$s1" >> "$GITHUB_ENV"
      - name: Laws (full tier)
        shell: bash
        env:
          BAYAN_TEST_TIME_SCALE: 3
          # L043 re-exports with the frozen C# compiler; ddc.yml, the one job with .NET, runs it (spec 019 R27).
          BAYAN_LAWS_LEFT: L043
        run: |
          mkdir -p tmp
          bash scripts/selfhost/pre-push-laws.sh 2>&1 | tee tmp/ci-laws.log
      # Spec 019 T30h item 2 and T30d: the corpus-wide coverage, mutate and ownership theories and the emitted-C libc inventory
      # (libc mode) over tests/cases/run, through the stage-1 driver of the build step (scripts/ci/nightly-modes.sh;
      # scripts/test.sh does not run it).
      - name: Run cases under coverage, mutate, ownership and libc
        shell: bash
        run: |
          mkdir -p tmp
          bash scripts/ci/nightly-modes.sh --jobs 4 2>&1 | tee tmp/ci-nightly-modes.log
      # Traces: the two long steps' full output and the test runner's logs, kept whether the job passed, failed or was
      # cancelled, so a failure is readable without waiting for the whole calling run to end.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laws-nightly-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/ci-*.log
            tmp/test.*/
            tmp/bootstrap-build/stage*.log
          if-no-files-found: ignore
