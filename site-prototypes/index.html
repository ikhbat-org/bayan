<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bayan brand assets: contact sheet (prototype)</title>
<style>
body{margin:0;font:14px/1.4 Georgia,serif}
section{padding:24px 32px}
.parchment{background:#F6F1E7;color:#1F3A5F}
.night{background:#14202E;color:#EDE6D6}
h2,h3{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;margin-bottom:20px}
figure{margin:0;text-align:center}
figcaption{font-size:12px;margin-top:6px}
.night img[src*="wordmark"],.night img[src*="hoopoe"]{background:#14202E}
</style></head><body>
<section class="parchment"><h2>On parchment</h2><div class="row"><figure><img src="assets/mark.svg" height="160" alt="mark"><figcaption>mark.svg</figcaption></figure><figure><img src="assets/mark-on-night.svg" height="160" alt="mark-on-night"><figcaption>mark-on-night.svg</figcaption></figure><figure><img src="assets/favicon.svg" height="160" alt="favicon"><figcaption>favicon.svg</figcaption></figure><figure><img src="assets/wordmark.svg" height="160" alt="wordmark"><figcaption>wordmark.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-note.svg" height="160" alt="hoopoe-flat-note"><figcaption>hoopoe-flat-note.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-check.svg" height="160" alt="hoopoe-flat-check"><figcaption>hoopoe-flat-check.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-flight.svg" height="160" alt="hoopoe-flat-flight"><figcaption>hoopoe-flat-flight.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-scroll.svg" height="160" alt="hoopoe-flat-scroll"><figcaption>hoopoe-flat-scroll.svg</figcaption></figure><figure><img src="assets/hoopoe-calligraphic.svg" height="160" alt="hoopoe-calligraphic"><figcaption>hoopoe-calligraphic.svg</figcaption></figure></div><h3>Mark sizes</h3><div class="row"><figure><img src="assets/mark.svg" width="16" height="16" alt="mark 16px"><figcaption>16 px</figcaption></figure><figure><img src="assets/mark.svg" width="32" height="32" alt="mark 32px"><figcaption>32 px</figcaption></figure><figure><img src="assets/mark.svg" width="64" height="64" alt="mark 64px"><figcaption>64 px</figcaption></figure><figure><img src="assets/mark.svg" width="256" height="256" alt="mark 256px"><figcaption>256 px</figcaption></figure></div></section>
<section class="night"><h2>On night</h2><div class="row"><figure><img src="assets/mark.svg" height="160" alt="mark"><figcaption>mark.svg</figcaption></figure><figure><img src="assets/mark-on-night.svg" height="160" alt="mark-on-night"><figcaption>mark-on-night.svg</figcaption></figure><figure><img src="assets/favicon.svg" height="160" alt="favicon"><figcaption>favicon.svg</figcaption></figure><figure><img src="assets/wordmark.svg" height="160" alt="wordmark"><figcaption>wordmark.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-note.svg" height="160" alt="hoopoe-flat-note"><figcaption>hoopoe-flat-note.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-check.svg" height="160" alt="hoopoe-flat-check"><figcaption>hoopoe-flat-check.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-flight.svg" height="160" alt="hoopoe-flat-flight"><figcaption>hoopoe-flat-flight.svg</figcaption></figure><figure><img src="assets/hoopoe-flat-scroll.svg" height="160" alt="hoopoe-flat-scroll"><figcaption>hoopoe-flat-scroll.svg</figcaption></figure><figure><img src="assets/hoopoe-calligraphic.svg" height="160" alt="hoopoe-calligraphic"><figcaption>hoopoe-calligraphic.svg</figcaption></figure></div><h3>Mark sizes</h3><div class="row"><figure><img src="assets/mark-on-night.svg" width="16" height="16" alt="mark 16px"><figcaption>16 px</figcaption></figure><figure><img src="assets/mark-on-night.svg" width="32" height="32" alt="mark 32px"><figcaption>32 px</figcaption></figure><figure><img src="assets/mark-on-night.svg" width="64" height="64" alt="mark 64px"><figcaption>64 px</figcaption></figure><figure><img src="assets/mark-on-night.svg" width="256" height="256" alt="mark 256px"><figcaption>256 px</figcaption></figure></div></section>
</body></html>
