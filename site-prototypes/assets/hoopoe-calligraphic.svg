<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Calligraphic hoopoe composed from the letters of بيان (composition sketch)</title>
  <!-- Composition only: bowl of ن = body, alif = neck, teeth of ب and ي = crest fan, swash of ي = wing, end of the bowl = tail. The four dots are the crest tips. No face. -->
  <g fill="none" stroke="#1F3A5F" stroke-linecap="round" stroke-linejoin="round">
    <path class="teeth" d="M62 66 L34 48 M62 66 L42 34 M62 66 L66 28 M62 66 L90 38" stroke-width="9"/>
    <path class="alif" d="M62 70 C58 90 52 108 56 128" stroke-width="18"/>
    <path class="tail" d="M176 188 C196 196 214 212 238 232" stroke-width="20"/>
  </g>
  <circle class="head" cx="62" cy="68" r="15" fill="#1F3A5F"/>
  <path class="bowl" d="M44 120 C40 170 70 206 122 208 C160 210 184 196 200 172 L186 128 C150 108 100 104 62 116 Z" fill="#1F3A5F"/>
  <path class="wing" d="M84 134 C120 118 170 128 212 172 C166 164 122 170 90 184 C80 170 78 150 84 134 Z" fill="#EDE6D6"/>
  <path class="dot" d="M34 40 L42 48 L34 56 L26 48 Z" fill="#C08A2E"/>
  <path class="dot" d="M42 20 L50 28 L42 36 L34 28 Z" fill="#C08A2E"/>
  <path class="dot" d="M66 14 L74 22 L66 30 L58 22 Z" fill="#C08A2E"/>
  <path class="dot" d="M94 30 L102 38 L94 46 L86 38 Z" fill="#C08A2E"/>
</svg>
