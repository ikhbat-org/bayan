<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs><clipPath id="wing-clip"><path d="M84 134 C120 118 170 128 212 172 C166 164 122 170 90 184 C80 170 78 150 84 134 Z"/></clipPath></defs>
  <title>Calligraphic hoopoe composed from the letters of بيان (composition sketch)</title>
  <!-- Composition only: bowl of ن = body, alif = neck, teeth of ب and ي = crest fan, swash of ي = wing, end of the bowl = tail. The four dots are the crest tips. No face. -->
  <g fill="none" stroke="#EDE6D6" stroke-linecap="round" stroke-linejoin="round">
    <path class="teeth" d="M62 66 L34 48 M62 66 L42 34 M62 66 L66 28 M62 66 L90 38" stroke-width="9"/>
    <path class="alif" d="M62 70 C58 90 52 108 56 128" stroke-width="18"/>
    <path class="tail" d="M176 188 C196 196 214 212 238 232" stroke-width="20"/>
  </g>
  <circle class="head" cx="62" cy="68" r="15" fill="#EDE6D6"/>
  <path class="bowl" d="M44 120 C40 170 70 206 122 208 C160 210 184 196 200 172 L186 128 C150 108 100 104 62 116 Z" fill="#EDE6D6"/>
  <path class="wing" d="M84 134 C120 118 170 128 212 172 C166 164 122 170 90 184 C80 170 78 150 84 134 Z" fill="#D9A05B"/>
  <g class="wing-bands" clip-path="url(#wing-clip)" fill="none" stroke="#14202E" stroke-width="7">
    <path d="M112 118 C104 140 104 164 114 190"/>
    <path d="M142 118 C134 140 134 162 142 186"/>
    <path d="M172 124 C166 142 166 160 172 180"/>
  </g>
  <g class="tail-bands" fill="none" stroke="#14202E" stroke-width="5" stroke-linecap="butt">
    <path d="M196 186 L188 204"/>
    <path d="M214 200 L204 216"/>
  </g>
  <path class="dot" d="M34 40 L42 48 L34 56 L26 48 Z" fill="#E0AE55"/>
  <path class="dot" d="M42 20 L50 28 L42 36 L34 28 Z" fill="#E0AE55"/>
  <path class="dot" d="M66 14 L74 22 L66 30 L58 22 Z" fill="#E0AE55"/>
  <path class="dot" d="M94 30 L102 38 L94 46 L86 38 Z" fill="#E0AE55"/>
</svg>
