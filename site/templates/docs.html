<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{root}}assets/brand/favicon/favicon.ico" sizes="48x48">
<link rel="icon" href="{{root}}assets/brand/favicon/favicon-auto.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{root}}assets/style.css">
<script>
(function () {
  /* Theme: light, dark or system (the default). Runs before first paint, so a chosen theme shows at once. */
  var root = document.documentElement, key = 'bayan-theme', order = ['light', 'dark', 'system'], theme = 'system';
  try { theme = localStorage.getItem(key) || 'system'; } catch (e) {}
  if (order.indexOf(theme) < 0) theme = 'system';
  function apply() {
    if (theme === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', theme);
    var btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = 'Theme: ' + theme;
  }
  apply();
  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('theme-btn');
    if (!btn) return;
    btn.hidden = false;
    apply();
    btn.addEventListener('click', function () {
      theme = order[(order.indexOf(theme) + 1) % order.length];
      try { localStorage.setItem(key, theme); } catch (e) {}
      apply();
    });
  });
})();
</script>
<title>{{title}} - Bayān</title>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-head">
  <div class="wrap head-row">
    <a class="brand" href="{{root}}index.html" aria-label="Bayān home">Bayān <span lang="ar" dir="rtl" aria-hidden="true">بيان</span></a>
    <span class="version">Bayān {{version}}</span>
    <nav aria-label="Main">
      <a href="{{root}}tutorial.html">Learn</a>
      <a href="{{docs}}">Reference</a>
      <a href="{{root}}roadmap.html">Roadmap</a>
      <a href="{{root}}docs/{{version}}/index.html">Docs</a>
      <a href="{{root}}install.html">Download</a>
    </nav>
    <button type="button" class="theme-btn" id="theme-btn" title="Switch between light, dark and the system setting" hidden>Theme: system</button>
  </div>
</header>

<div class="wrap docs" id="docs">
  <aside class="side" aria-label="Documentation">
    <details open>
      <summary>Documentation</summary>
{{sidebar}}
    </details>
  </aside>

  <main id="main">
    <div class="crumbs-row">
      <p class="crumbs">{{group}}</p>
      <button type="button" class="toc-btn" id="toc-btn" aria-controls="toc" aria-expanded="true">On this page</button>
    </div>
    <article class="prose">
      <h1>{{title}}</h1>
{{body}}
      <nav class="pager" aria-label="Previous and next">
{{pager}}
      </nav>
    </article>
  </main>

  <nav class="toc" id="toc" aria-label="On this page">
    <h2>On this page</h2>
    <ul>
{{toc}}
    </ul>
  </nav>
</div>

<footer class="site-foot">
  <div class="wrap">
    <span>Bayān is made by the Ikhbat Foundation.</span>
    <nav aria-label="Site">
{{headnav}}
<a href="{{root}}manifesto.html">Manifesto</a>
    </nav>
  </div>
</footer>
<script>
(function () {
  var docs = document.getElementById('docs'), btn = document.getElementById('toc-btn'), toc = document.getElementById('toc');
  function set(open) {
    toc.hidden = !open;
    docs.classList.toggle('toc-off', !open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  var side = document.querySelector('.side details');
  if (side && window.matchMedia('(max-width: 63.99rem)').matches) side.removeAttribute('open');
  var saved = null;
  try { saved = localStorage.getItem('bayan-toc'); } catch (e) {}
  set(saved !== 'closed');
  btn.addEventListener('click', function () {
    var open = btn.getAttribute('aria-expanded') !== 'true';
    set(open);
    try { localStorage.setItem('bayan-toc', open ? 'open' : 'closed'); } catch (e) {}
  });
})();
</script>
</body>
</html>
